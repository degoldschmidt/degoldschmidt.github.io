<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ page.title | default: site.title }}</title>

<!-- Fonts: one request, discovered during HTML parse. Replaces six render-blocking
     @imports that could not even be *discovered* until the parent CSS had parsed. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600&family=Lato:wght@300;400&display=swap"
/>

<link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}" />
<link rel="icon" href="{{ '/images/me.jpg' | relative_url }}" />
