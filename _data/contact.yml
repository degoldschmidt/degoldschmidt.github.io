# render only what is filled in, so an empty value is simply omitted rather than
# shipping a placeholder. Nothing here is guessed; fill in what you want public.
#
# Until `email` is set, the site has no contact route at all, which makes a
# poster QR code a dead end. That is the one field worth doing first.

# Split so the address is assembled in the page rather than sitting in the HTML
# as one scrapable string. Not real security — just cheap friction.
