# Newest first. The rendered [n] counts DOWN, so entry 1 renders as the highest
# number — the counter start is derived from the array size in pubs.html, not
# hard-coded, so adding an entry can't desynchronise the numbering.
#
# `authors` carries raw HTML on purpose (bold on Dennis's own name). Liquid does
# not auto-escape, so it passes through.
# `doi` is a bare identifier — pubs.html builds the https://doi.org/ URL from it.

