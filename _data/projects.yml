# Filters render in this order. `all` is the default (the old MixItUp config
# loaded ".fmi, .phd" while the active highlight sat on "postdoc" — they never
# matched). The old "software" and "open science" filters are gone: `soft`
# matched zero cards (the art projects were tagged `software`, not `soft`) and
# nothing was ever tagged `open`.
filters:
  - { id: all, label: "all" }
  - { id: fmi, label: "postdoc" }
  - { id: phd, label: "phd" }
  - { id: neuro, label: "neural circuits" }
  - { id: behav, label: "behavior" }
  - { id: ml, label: "machine learning" }
  - { id: hard, label: "hardware" }
  - { id: soft, label: "software" }
  - { id: art, label: "art & visualization" }
  - { id: past, label: "completed projects" }

# Only cards with real images. The five held back below all pointed at
# images/tbd.jpg, a grey "TBD" placeholder — five identical grey tiles read as
# abandoned. Uncomment as images become available; no HTML or JS changes needed.
