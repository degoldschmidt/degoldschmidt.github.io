# Grouped rather than filtered. With ~8 items a filter bar is noise, and four of
# its ten buttons matched nothing because the ML/software/art work has no cards.
#
# `alt` describes the IMAGE CONTENT and must not repeat `title` — the title is
# already the visible caption, so an alt that echoes it tells a screen-reader
# user nothing new. All six shipped with alt="" before, marking a confocal image,
# a rig photo and three model diagrams as decorative.
#
# `link` is optional. Cards without one are not interactive and must not look it.

groups:
  - id: now
    label: "Now"
    blurb: >-
      Postdoctoral work in the Felsenberg Lab: how visual context decides which
      olfactory memories are retrieved.
  - id: before
    label: "Before"
    blurb: >-
      PhD work on the circuits and behaviour of foraging flies, and earlier work
      on insect-inspired navigation in walking robots.
  - id: tools
    label: "Methods &amp; tools"
    blurb: >-
      The rigs and pipelines the experiments run on &mdash; closed-loop tracking,
      optogenetics, and the analysis around them.

items:
  - title: "Neuronal mechanisms of context-dependent memory retrieval"
    group: now
    image: /images/portfolios/postdoc/memory.png
    # A diagram, so it is fitted rather than cropped — see .card--contain.
    # Photographs can lose their edges to the card ratio; labelled figures
    # cannot.
    fit: contain
    alt: >-
      Paradigm diagram: a contingency table pairing two odours with a green
      danger panorama and a blue safe panorama, a fly walking on a ball inside a
      closed-loop visual arena, and a 2D grid of alternating odour patches.
    # No `link:` on purpose. This card pointed at /model.html, which is not
    # linked from anywhere on the site until the model has been read for
    # scientific accuracy. The page still builds and still resolves. Restore
    # these two lines to put the card back:
    #   link: /model.html
    #   link_label: "play with the model"
    # Kept in step with `approach:` in _data/poster.yml. Both describe the same
    # work, and until now they disagreed: this said "punishment" where the VR
    # uses an infrared laser, and claimed the circuit question was already being
    # asked rather than that the setup was built to ask it.
    text: >-
      A fly learns that an odour predicts a targeted infrared laser pulse
      &mdash; but only in one visual context. I built a closed-loop virtual
      reality to put that context under experimental control, designed so the
      mushroom body can be imaged while the fly walks through it.

  - title: "What shapes a fly's search after it finds food"
    group: before
    image: /images/portfolios/phd/img01_graphicalAbstract1.png
    # A labelled diagram at 1.72:1 against the card grid's 1.31:1, so `cover`
    # would crop the food visit off the left and the search pattern off the
    # right — the two ends that carry the argument.
    fit: contain
    alt: >-
      Graphical abstract: a fly that has visited food, with metabolic state
      driving locomotor adjustments and sensory guidance feeding into short
      and long trips, beside a trajectory whose loops widen over time into an
      expanding search pattern.
    link: "https://doi.org/10.1016/j.cub.2026.02.037"
    link_label: "Curr. Biol. 2026"
    text: >-
      A fly that finds food does not walk away from it &mdash; it searches the
      area it just left. How long it keeps searching, and how far it ranges,
      depends on what it has recently eaten and how sated it is, so the pattern
      widens as the memory of the meal fades.

  - title: "Turning hunger and patch richness into a decision"
    group: before
    image: /images/portfolios/phd/F1zyIkeXwAM_87C.jpeg
    # 2.94:1 against the card grid's 1.31:1 — the widest image on the site, and
    # `cover` would crop off both cell bodies, which are the point of a
    # bilateral pair.
    fit: contain
    alt: >-
      Confocal image of a fly brain with one neuron of a bilateral pair labelled
      in magenta and the other in cyan, each running from a cell body at the
      outer edge to dense arborisations, meeting along a shared tract at the
      midline.
    link: "https://doi.org/10.1101/2023.07.19.549514"
    link_label: "bioRxiv 2023"
    text: >-
      How long a fly stays at a patch of food depends both on how hungry it is
      and on how rich the patch is. This work traces the neurons that carry
      those two estimates and turn them into a decision to stay or move on.

  # Replaces two earlier cards. It cited the same DOI as a "Closed-loop video
  # tracking of walking flies" card, so that one went; it then took the slot of
  # "Genetic manipulation of descending neurons", which was dropped. Both their
  # images — phd/tracking2.jpg and phd/dn.jpg — are now unused.
  #
  # In `before` rather than `tools`, which leaves the "Methods & tools" group
  # with no items; research.html guards on size, so that heading and blurb stop
  # rendering rather than appearing empty.
  - title: "optoPAD"
    group: before
    image: /images/portfolios/phd/optopad.jpg
    alt: >-
      Duotone illustration: a hand shines a torch across a table of foods
      &mdash; oatmeal, chocolate, tofu, greens and a doughnut &mdash; picking
      some out of the dark and leaving others in shadow.
    credit: "Illustration: Diogo Matias, Champalimaud Centre for the Unknown"
    link: "https://doi.org/10.7554/eLife.43924"
    link_label: "eLife 2019"
    text: >-
      A closed-loop system that detects the moment a fly starts to feed and
      fires a light pulse within milliseconds, so neurons can be activated while
      the animal eats rather than at some arbitrary time. It turns optogenetics
      from something done to a fly into something done during a behaviour.

  - title: "Adaptive vector navigation in embodied agents"
    group: before
    image: /images/portfolios/past/vector.jpg
    alt: >-
      Model schematic: head-direction, home-vector and global-vector neuron
      arrays feeding an action-selection stage and a CPG-based locomotion
      controller, beside the path-integration geometry between nest and feeder.
    link: "https://doi.org/10.3389/fnbot.2017.00020"
    link_label: "Front. Neurorobot. 2017"
    text: >-
      A neural model of path integration that lets a walking agent forage away
      from its nest and return along a home vector, without a map.

  - title: "Adaptive obstacle negotiation in embodied agents"
    group: before
    image: /images/portfolios/past/climb.jpg
    alt: >-
      Learning-circuit diagram beside a simulated hexapod robot climbing a step,
      and photographs of the physical AMOS hexapod performing the same climb.
    link: "https://doi.org/10.3389/fnbot.2014.00003"
    link_label: "Front. Neurorobot. 2014"
    text: >-
      A hexapod robot that learns to anticipate obstacles from its own sensory
      history rather than being told the terrain in advance.

  - title: "Lower-limb exoskeleton"
    group: before
    image: /images/portfolios/past/exo.jpg
    alt: >-
      Two photographs of a person wearing a powered lower-limb exoskeleton, once
      climbing stairs and once seated.
    text: >-
      Early engineering work on a powered lower-limb exoskeleton, before I moved
      to neuroscience.

