# Everything that changes per conference lives here, so poster.html itself never
# needs editing between meetings and the printed QR code keeps working forever.
#
# /poster/ is ALWAYS the current poster. When you present a new one, archive the
# old page under /poster/<year>-<venue>/ and edit this file.

# The printed QR code points at the SITE ROOT, not at /poster/. `active` puts a
# banner at the top of the homepage so someone who has just scanned it is not
# dropped onto a generic bio page. Turn both on for the meeting, off afterwards.
active: true # banner on the homepage
in_nav: false # /poster in the top bar

# --- the meeting -------------------------------------------------------------
venue: "ICN 2026" # e.g. "FENS Forum 2026"
venue_url: "https://icn2026vancouver.com/" # e.g. "https://forum.fens.org/"
city: "Vancouver, BC, Canada" # e.g. "Lisbon"
number: "PS2.84" # e.g. "P-123"
session: "Tue 28 Jul, 16:00-18:00" # e.g. "Tue 8 Sep, 14:00-16:00"
date: "2026-07-28" # ISO, e.g. 2026-09-08 — used for the status line

# --- what this work is -------------------------------------------------------
# The headline: the largest text on /poster/ (where it is the page's h1) and on
# the homepage banner, and the only thing many visitors will read. The field is
# still called `question` for historical reasons; it holds whatever line should
# lead, and right now that is the poster's own title, so the page and the board
# someone is standing in front of say the same thing.
#
# Rendered raw, not escaped, so inline HTML works — which is how the genus gets
# its italics. Keep any markup here to <i>/<em>/<sub>/<sup>: this becomes an
# <h1>, so a block-level tag would produce invalid nesting.
question: "A closed-loop virtual reality approach to study context-dependent memory in <i>Drosophila</i>"

# One short paragraph. What you did, not what you found.
#
# Two sentences by design: the phenomenon, then the instrument built to get at
# it. A visitor needs a reason to care before an equipment description.
#
# Deliberately absent, and worth keeping absent — the poster has all of it, a
# permanently public page should not: the identity of the output neuron,
# calcium traces, the preliminary conditioning, effect sizes, driver lines.
# "Output neurons" stays generic on purpose.
#
# Note the imaging is phrased as a CAPABILITY, not a practice: it runs on the
# older ball setup, not yet in the VR. Change the tense here, not just the
# claim, if that changes.
approach: >-
  A fly can learn that an odour predicts a targeted infrared laser pulse, then
  act on that memory in one place and ignore it in another &mdash; context
  selects which memory is retrieved rather than simply cueing it. To put that
  context under experimental control we rebuilt the setup as a closed-loop
  virtual reality: a tethered fly walks on a ball and steers through a visual
  world that turns with it, designed so the same output neurons can be imaged
  while it moves.

# EMPTY ON PURPOSE — the "What we expect" section does not render at all while
# this list is. Dropped for ICN 2026: the ones here were a guess at a mechanism
# (Kenyon-cell layer versus output-neuron gating) rather than a claim Dennis
# would defend at the board, and a setup-and-validation poster has no
# predictions to stake yet.
#
# poster.html was NOT edited to remove the section — it is guarded by
# `{% if p.predictions %}`, so refilling this list is all it takes to bring it
# back. Two or three, if you do: stating predictions publicly timestamps the
# idea while the data stays yours, which is the anti-scooping argument for
# having them at all.
predictions: []

# --- publication status ------------------------------------------------------
# "unpublished" | "preprint" | "published". Drives the status line and the CTA,
# so the page never goes stale: when the work comes out, set status and doi and
# the call to action changes from "email me" to "read the paper".
status: "unpublished"
doi: ""

# --- the poster file itself --------------------------------------------------
# READ THIS BEFORE FILLING IT IN.
#
# GitHub Pages has NO access control. Anything referenced here is public,
# permanently, and archived by third parties — an unlisted URL is not private.
# If the poster shows unpublished results, effect sizes, or unpublished driver
# lines, do NOT put the PDF here.
#
#   pdf: "/assets/poster-2026-fens.pdf"   -> served publicly from the repo
#   pdf_doi: "10.5281/zenodo.XXXXXXX"     -> Zenodo, which can be restricted
#                                            and earns a citable DOI
#   both empty                            -> page offers "available on request"
#                                            via email, which is the safe default
pdf: ""
pdf_doi: ""
