# The rendered SEO title is "<page> | <title>". This used to be the handle
# "de-goldschmidt", so someone googling his actual name was fighting the site.
title: Dennis Goldschmidt
tagline: Systems neuroscience · FMI Basel
author: Dennis Goldschmidt
description: >-
  Dennis Goldschmidt — postdoctoral researcher in systems neuroscience at the
  Friedrich Miescher Institute for Biomedical Research, Basel, Switzerland.
url: "https://degoldschmidt.github.io"
baseurl: "" # user site — served from the domain root

# Posts only; pages are unaffected by this key. Preserves /blog/<slug>.html.
# Do NOT set a "pretty" permalink style — it would rewrite pages to /about/
# and break every existing inbound link.
permalink: /blog/:title:output_ext

# Pin the timezone: GitHub Pages builds in UTC and a local build uses the
# machine's zone, so without this the same post renders a different time in
# each. Post dates carry explicit offsets and are converted to this zone.
timezone: Europe/Zurich

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# jekyll-seo-tag / -sitemap / -feed are supported on GitHub Pages but are NOT
# automatic — they only load if listed here.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Single source of truth for the nav breakpoint. Referenced from css/main.css
# (which has front matter so Liquid runs over it) and from the toggle script in
# _layouts/default.html — it was hard-coded in four places.
bp_nav: 48em
bp_nav_below: 47.99em

defaults:
  - scope: { path: "", type: pages }
    values: { layout: default }
  - scope: { path: "", type: posts }
    values: { layout: post }

# WARNING: defining `exclude` REPLACES Jekyll's built-in list, so the
# Gemfile/vendor entries below must be restated or they get published.
# README.md is excluded because the always-on jekyll-readme-index plugin
# (which cannot be disabled on Pages) would otherwise treat it as an index.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
  - README.md
  - ROADMAP.md
  # .gitignore does NOT affect Jekyll — it copies anything on disk that is not
  # excluded here. Without this line the poster PDF is written into _site even
  # though git ignores it.
  - posters/
  - LICENSE
  - serve.sh
