# The rendered SEO title is "<page> | <title>". This used to be the handle
# "de-goldschmidt", so someone googling his actual name was fighting the site.
title: Dennis Goldschmidt
tagline: Systems neuroscience · FMI Basel
author: Dennis Goldschmidt
description: >-
  Dennis Goldschmidt — postdoctoral researcher in systems neuroscience at the
  Friedrich Miescher Institute for Biomedical Research, Basel, Switzerland.
url: "https://degoldschmidt.github.io"
baseurl: "" # user site — served from the domain root

# Posts only; pages are unaffected by this key. Preserves /blog/<slug>.html.
# Do NOT set a "pretty" permalink style — it would rewrite pages to /about/
# and break every existing inbound link.
permalink: /blog/:title:output_ext

# Pin the timezone: GitHub Pages builds in UTC and a local build uses the
# machine's zone, so without this the same post renders a different time in
# each. Post dates carry explicit offsets and are converted to this zone.
timezone: Europe/Zurich

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# jekyll-seo-tag / -sitemap / -feed are supported on GitHub Pages but are NOT
# automatic — they only load if listed here.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Narrow-viewport breakpoint, read from css/main.css (which carries front
# matter so Liquid runs over it). Media queries cannot use CSS custom
# properties, so this is the only way to avoid hard-coding it.
#
# It was the nav breakpoint until the sidebar became a top bar; that bar wraps
# on content width and needs no breakpoint. Only `bp_nav_below` is read now, by
# the background-mesh query. `bp_nav` is kept because the pair documents each
# other — a lone 47.99em would read as a magic number.
bp_nav: 48em
bp_nav_below: 47.99em

defaults:
  - scope: { path: "", type: pages }
    values: { layout: default }
  - scope: { path: "", type: posts }
    values: { layout: post }

# WARNING: defining `exclude` REPLACES Jekyll's built-in list, so the
# Gemfile/vendor entries below must be restated or they get published.
# README.md is excluded because the always-on jekyll-readme-index plugin
# (which cannot be disabled on Pages) would otherwise treat it as an index.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
  - README.md
  # Needs its own entry: the `README.md` line above is a path, so it matches
  # only the one at the root. jekyll-readme-index would publish this one as
  # /assets/media/.
  - assets/media/README.md
  - ROADMAP.md
  - HANDOFF.md
  # .gitignore does NOT affect Jekyll — it copies anything on disk that is not
  # excluded here. Without these lines the poster PDF and the source video are
  # written into _site even though git ignores both.
  - posters/
  - videos/
  # Figure sources and clip-art. Gitignored too, so GitHub Pages never sees
  # them — Pages builds from the repo, not from a local _site. These entries
  # only keep the local build matching production, which matters because
  # _site is the thing you actually look at.
  - images/portfolios/postdoc/fig2_project_objectives.svg
  - images/portfolios/postdoc/fig2_project_objectives_small.svg
  - images/portfolios/postdoc/fig2_project_objectives_small.png
  - images/portfolios/postdoc/95-951286_laser-clipart-laser-beam-red-laser-beam-icon.png
  - images/portfolios/postdoc/Industry-Laser-Beam-icon.png
  - LICENSE
  - serve.sh
